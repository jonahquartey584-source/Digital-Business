# Netlify config for the Functions backend under netlify/functions/ — see
# the "Going live on Netlify" section in README.md. The site itself is
# plain static HTML/CSS/JS with no build step, so there's no [build] block.

[functions]
  directory = "netlify/functions"

# Keep the internal dashboard available at the short address shown to the
# administrator. The trailing-dot rule also repairs the commonly pasted
# "admin." address by sending it to the canonical clean URL.
[[redirects]]
  from = "/admin."
  to = "/admin"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200
