# Netlify config for the Functions backend under netlify/functions/ — see
# the "Going live on Netlify" section in README.md. The site itself is
# plain static HTML/CSS/JS with no build step, so there's no [build] block.

[functions]
  directory = "netlify/functions"

# The site is also reachable at its default qp-digital.netlify.app address
# (every Netlify site gets one) — that's Netlify's own domain, not ours,
# and it's what shows up in search results/link previews as "Netlify"
# instead of Qp Digital if anyone ever links to it. Force every request on
# that host straight to the real domain so it's never the version anyone
# sees, shares or has indexed.
[[redirects]]
  from = "https://qp-digital.netlify.app/*"
  to = "https://qp-digital.co.uk/:splat"
  status = 301
  force = true

# ── The client workspace, on its own address ────────────────────────────
#
# The CRM, booking system and members portal are the product clients pay
# for; the rest of the site is the shop window. Serving them from
# app.qp-digital.com keeps the two apart, so a client never sees a
# marketing URL with ".html" on the end while they are working.
#
# This is a front door, not a second site. Netlify Identity belongs to one
# Netlify project, and crm-data.mts reads the signed-in user server-side
# through getUser() on that project. A genuinely separate site would mean
# a second, empty Identity instance — every existing client login would
# stop working, and the API calls would become cross-origin with no valid
# token. Same project, extra hostname: nothing behind the scenes moves.
#
# These rules are NOT forced, so a real file still wins. Assets
# (style.css, crm-app.js, the icons) and the /api/* function routes above
# resolve normally; only paths with nothing behind them fall through to
# the app shell.
#
# Both domains are listed while the move from .co.uk to .com is in
# progress. The .co.uk pair can be deleted once the move is finished.
[[redirects]]
  from = "https://app.qp-digital.com/"
  to = "/crm.html"
  status = 200

[[redirects]]
  from = "https://app.qp-digital.co.uk/"
  to = "/crm.html"
  status = 200

# Friendly paths for the other two tools on the same subdomain.
[[redirects]]
  from = "https://app.qp-digital.com/bookings"
  to = "/booking-system.html"
  status = 200

[[redirects]]
  from = "https://app.qp-digital.co.uk/bookings"
  to = "/booking-system.html"
  status = 200

[[redirects]]
  from = "https://app.qp-digital.com/account"
  to = "/members.html"
  status = 200

[[redirects]]
  from = "https://app.qp-digital.co.uk/account"
  to = "/members.html"
  status = 200

# Keep the internal dashboard available at the short address shown to the
# administrator. The trailing-dot rule also repairs the commonly pasted
# "admin." address by sending it to the canonical clean URL.
[[redirects]]
  from = "/admin."
  to = "/admin"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200

# ── Security headers ────────────────────────────────────────────────────
#
# Applied to every response. Before this, Netlify's deploy log reported
# "No header rules processed" — the site shipped with no CSP, no HSTS and
# no clickjacking protection at all.
#
# script-src carries no 'unsafe-inline'. Instead each inline <script> is
# allowed by its own SHA-256 hash, so an injected <script> (e.g. through a
# CRM lead name or an enquiry message rendered into the DOM) will not run.
# THE HASHES BELOW MUST BE REGENERATED IF ANY INLINE SCRIPT CHANGES —
# editing one without updating its hash silently stops it executing. To
# regenerate them all:
#
#   python3 - <<'PY'
#   import glob, re, hashlib, base64
#   pat = re.compile(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', re.S)
#   for h in sorted({"sha256-" + base64.b64encode(hashlib.sha256(b.encode()).digest()).decode()
#                    for f in glob.glob("*.html") for b in pat.findall(open(f).read())}):
#       print(f"'{h}'")
#   PY
#
# The inline scripts these cover are the theme guard (which has to run
# before first paint to avoid a flash of the wrong theme, so it cannot be
# moved to a file), the members.html import map, and payment-success.html's
# status lookup.
#
# style-src does keep 'unsafe-inline' — there are ~51 inline style
# attributes in the markup, and inline styles cannot execute script.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self' https://js.stripe.com https://esm.sh \
        'sha256-ZAyMMYydfyReEFYvVl2J3eWRNm6GwhZJLPgvt998HTk=' \
        'sha256-49aQ7ZI0flR9h9cPyMYFfTN4w22UeiDjKLiYqe/aYro=' \
        'sha256-TmwOXiqJld404yts4tvfS9aqFNQgvGiZxRhxqujBAhM=' \
        'sha256-xdRPkUT/UCE2XwKw+VO8BBqDy4cZuEWhoEIcAsFlrtE=' \
        'sha256-md0tgYoJ3Wk9bgUTtuJAWpqQQeUlwFJLa9WHn/ABnBA='; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com data:; \
      img-src 'self' data: blob: https:; \
      connect-src 'self' https://esm.sh https://api.stripe.com; \
      frame-src https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; \
      form-action 'self' https://buy.stripe.com https://checkout.stripe.com; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      object-src 'none'; \
      upgrade-insecure-requests"""
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# robots.txt is only advisory — a crawler is free to ignore it. X-Robots-Tag
# is enforced, so the admin tooling and the post-payment page (which shows a
# client's portal code) stay out of search results either way.
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pipeline-tester.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/payment-success.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The client workspace is a signed-in application, not a page for the
# public. It was reachable to crawlers: crm.html, members.html and
# booking-system.html carried no exclusion at all, so the login shells
# could surface in search results under the marketing domain.
[[headers]]
  for = "/crm.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/members.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/booking-system.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
