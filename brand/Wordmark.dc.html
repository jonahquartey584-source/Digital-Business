<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #000000; } a:hover { color: #333333; }
    .qp { font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>
</helmet>

<div class="qp" style="width: 900px; height: 520px; background: #ffffff; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-weight: 700; font-size: 25px; letter-spacing: -0.5px; color: #000000;">Wordmark lockups</div>
    <div style="font-weight: 400; font-size: 15px; color: #666666;">The monogram pairs with the wordmark; the full badge stands alone.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-weight: 600; font-size: 12px; letter-spacing: 1.4px; color: #8a8a8a;">HORIZONTAL</div>
    <div style="border: 1px solid #e2e2e2; padding: 26px 30px; display: flex; align-items: center; gap: 26px;">
      <svg width="92" height="92" viewBox="0 0 100 100" style="display: block; flex: none;">
        <circle cx="50" cy="50" r="50" fill="#000000"/>
        <text x="50" y="46.5" text-anchor="middle" dominant-baseline="central" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
              font-size="48" font-weight="700" letter-spacing="-1" fill="#ffffff">Qp</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="font-weight: 700; font-size: 46px; letter-spacing: -1.1px; color: #000000; line-height: 0.92;">Qp Market</div>
        <div style="font-weight: 500; font-size: 13px; letter-spacing: 5.2px; color: #666666;">PRELOVED · RESOLD</div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 22px;">
    <div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
      <div style="font-weight: 600; font-size: 12px; letter-spacing: 1.4px; color: #8a8a8a;">STACKED</div>
      <div style="border: 1px solid #e2e2e2; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; height: 100%; box-sizing: border-box;">
        <svg width="78" height="78" viewBox="0 0 100 100" style="display: block; flex: none;">
        <circle cx="50" cy="50" r="50" fill="#000000"/>
        <text x="50" y="46.5" text-anchor="middle" dominant-baseline="central" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
              font-size="48" font-weight="700" letter-spacing="-1" fill="#ffffff">Qp</text>
      </svg>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <div style="font-weight: 700; font-size: 30px; letter-spacing: -0.8px; color: #000000; line-height: 1;">Qp Market</div>
          <div style="font-weight: 500; font-size: 11px; letter-spacing: 4.5px; color: #666666;">PRELOVED · RESOLD</div>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
      <div style="font-weight: 600; font-size: 12px; letter-spacing: 1.4px; color: #8a8a8a;">TEXT ONLY</div>
      <div style="border: 1px solid #e2e2e2; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; height: 100%; box-sizing: border-box;">
        <div style="font-weight: 700; font-size: 38px; letter-spacing: -1px; color: #000000; line-height: 1;">Qp Market</div>
        <div style="font-weight: 500; font-size: 12px; letter-spacing: 5px; color: #666666;">PRELOVED · RESOLD</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
