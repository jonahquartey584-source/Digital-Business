<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c8663a; } a:hover { color: #a64e27; }
    .qp { font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>
</helmet>

<div class="qp" style="width: 900px; height: 520px; background: #f7f4ef; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 30px;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-weight: 700; font-size: 25px; letter-spacing: -0.5px; color: #241f1b;">Wordmark</div>
    <div style="font-weight: 400; font-size: 15px; color: #6f665d;">Horizontal for banners, stacked for square spaces.</div>
  </div>

  <!-- Horizontal -->
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-weight: 500; font-size: 12px; letter-spacing: 1.4px; color: #8b8178;">HORIZONTAL</div>
    <div style="border: 1px solid #ded8cf; padding: 30px 34px; display: flex; align-items: center; gap: 26px;">
      <div style="width: 92px; height: 92px; border-radius: 50%; background: #c8663a; display: flex; align-items: center; justify-content: center; flex: none;">
        <span style="font-weight: 700; font-size: 44px; letter-spacing: -1px; color: #f7f4ef; line-height: 1; transform: translateY(-3px);">Qp</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="font-weight: 700; font-size: 46px; letter-spacing: -1.2px; color: #241f1b; line-height: 0.92;">Qp Market</div>
        <div style="font-weight: 500; font-size: 13px; letter-spacing: 5.5px; color: #6f665d;">PRELOVED · RESOLD</div>
      </div>
    </div>
  </div>

  <!-- Stacked -->
  <div style="display: flex; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
      <div style="font-weight: 500; font-size: 12px; letter-spacing: 1.4px; color: #8b8178;">STACKED</div>
      <div style="border: 1px solid #ded8cf; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <div style="width: 78px; height: 78px; border-radius: 50%; background: #c8663a; display: flex; align-items: center; justify-content: center;">
          <span style="font-weight: 700; font-size: 37px; letter-spacing: -0.8px; color: #f7f4ef; line-height: 1; transform: translateY(-3px);">Qp</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <div style="font-weight: 700; font-size: 32px; letter-spacing: -0.8px; color: #241f1b; line-height: 1;">Qp Market</div>
          <div style="font-weight: 500; font-size: 11px; letter-spacing: 4.5px; color: #6f665d;">PRELOVED · RESOLD</div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
      <div style="font-weight: 500; font-size: 12px; letter-spacing: 1.4px; color: #8b8178;">TEXT ONLY</div>
      <div style="border: 1px solid #ded8cf; padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; height: 100%; box-sizing: border-box;">
        <div style="font-weight: 700; font-size: 40px; letter-spacing: -1px; color: #241f1b; line-height: 1;">Qp Market</div>
        <div style="font-weight: 500; font-size: 12px; letter-spacing: 5px; color: #6f665d;">PRELOVED · RESOLD</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
