<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c8663a; } a:hover { color: #a64e27; }
    .qp { font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>
</helmet>

<div class="qp" style="width: 900px; height: 640px; background: #f7f4ef; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 34px;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-weight: 700; font-size: 25px; letter-spacing: -0.5px; color: #241f1b;">Profile picture</div>
    <div style="font-weight: 400; font-size: 15px; color: #6f665d;">Shown at the sizes Vinted actually renders it.</div>
  </div>

  <!-- True-size row: 240 / 96 / 48 px -->
  <div style="display: flex; align-items: flex-end; gap: 44px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="width: 200px; height: 200px; border-radius: 50%; background: #c8663a; display: flex; align-items: center; justify-content: center;">
        <span style="font-weight: 700; font-size: 96px; letter-spacing: -2px; color: #f7f4ef; line-height: 1; transform: translateY(-7px);">Qp</span>
      </div>
      <div style="font-weight: 500; font-size: 12px; letter-spacing: 1.5px; color: #8b8178;">200 PX</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="width: 96px; height: 96px; border-radius: 50%; background: #c8663a; display: flex; align-items: center; justify-content: center;">
        <span style="font-weight: 700; font-size: 46px; letter-spacing: -1px; color: #f7f4ef; line-height: 1; transform: translateY(-3px);">Qp</span>
      </div>
      <div style="font-weight: 500; font-size: 12px; letter-spacing: 1.5px; color: #8b8178;">96 PX</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="width: 48px; height: 48px; border-radius: 50%; background: #c8663a; display: flex; align-items: center; justify-content: center;">
        <span style="font-weight: 700; font-size: 23px; letter-spacing: -0.5px; color: #f7f4ef; line-height: 1; transform: translateY(-2px);">Qp</span>
      </div>
      <div style="font-weight: 500; font-size: 12px; letter-spacing: 1.5px; color: #8b8178;">48 PX</div>
    </div>
  </div>

  <!-- In situ: a seller row the way a buyer scans it -->
  <div style="border-top: 1px solid #ded8cf; padding-top: 28px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-weight: 500; font-size: 12px; letter-spacing: 1.5px; color: #8b8178;">IN A SELLER LIST</div>
    <div style="display: flex; flex-direction: column; gap: 12px;">

      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #c8663a; display: flex; align-items: center; justify-content: center; flex: none;">
          <span style="font-weight: 700; font-size: 25px; letter-spacing: -0.6px; color: #f7f4ef; line-height: 1; transform: translateY(-2px);">Qp</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 600; font-size: 16px; color: #241f1b;">qpmarket</div>
          <div style="font-weight: 400; font-size: 13px; color: #6f665d;">128 items · ★ 4.9</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; opacity: 0.45;">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #d8d2c9; flex: none;"></div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 600; font-size: 16px; color: #241f1b;">another_seller</div>
          <div style="font-weight: 400; font-size: 13px; color: #6f665d;">41 items · ★ 4.7</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; opacity: 0.45;">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #cfc8be; flex: none;"></div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-weight: 600; font-size: 16px; color: #241f1b;">vintage_finds</div>
          <div style="font-weight: 400; font-size: 13px; color: #6f665d;">87 items · ★ 4.8</div>
        </div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
