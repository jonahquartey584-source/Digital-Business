<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c8663a; } a:hover { color: #a64e27; }
    .qp { font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>
</helmet>

<div class="qp" style="width: 1040px; height: 640px; background: #f7f4ef; display: flex; flex-direction: column;">

  <!-- Primary lockup on paper -->
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 36px;">
    <div style="width: 168px; height: 168px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex: none;">
      <span style="font-weight: 700; font-size: 81px; letter-spacing: -1.7px; color: #f7f4ef; line-height: 1; transform: translateY(-6px);">Qp</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-weight: 700; font-size: 82px; letter-spacing: -2px; color: #241f1b; line-height: 0.92;">Qp Market</div>
      <div style="font-weight: 500; font-size: 19px; letter-spacing: 7.5px; color: #6f665d;">PRELOVED · RESOLD</div>
    </div>
  </div>

  <!-- Inverted lockup on ink -->
  <div style="height: 268px; background: #241f1b; display: flex; align-items: center; justify-content: center; gap: 32px;">
    <div style="width: 124px; height: 124px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex: none;">
      <span style="font-weight: 700; font-size: 60px; letter-spacing: -1.3px; color: #f7f4ef; line-height: 1; transform: translateY(-4px);">Qp</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-weight: 700; font-size: 60px; letter-spacing: -1.5px; color: #f7f4ef; line-height: 0.92;">Qp Market</div>
      <div style="font-weight: 500; font-size: 15px; letter-spacing: 6px; color: #9b9188;">PRELOVED · RESOLD</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c8663a","options":["#c8663a","#4f6b52","#2f5d78","#8a5a7a"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#c8663a' };
  }
}
</script>
</body>
</html>
