<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #000000; } a:hover { color: #333333; }
    .qp { font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>
</helmet>

<div class="qp" style="width: 1040px; height: 640px; background: #ffffff; display: flex; flex-direction: column;">

  <!-- The badge standing alone: this is the logo -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
    <svg width="230" height="230" viewBox="0 0 100 100" style="display: block; flex: none;">
        <circle cx="50" cy="50" r="50" fill="#000000"/>
        <text x="50" y="43" text-anchor="middle" dominant-baseline="central" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
              font-size="38" font-weight="700" letter-spacing="-0.8" fill="#ffffff">Qp</text>
        <text x="50" y="71" text-anchor="middle" dominant-baseline="central" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
              font-size="15" font-weight="600" letter-spacing="1.6" fill="#ffffff">MARKET</text>
      </svg>
    <div style="font-weight: 600; font-size: 12px; letter-spacing: 1.4px; color: #8a8a8a;">THE LOGO — USE THIS ON ITS OWN</div>
  </div>

  <!-- Paired with a wordmark, the mark drops to the monogram so the name
       isn't said twice in one lockup -->
  <div style="height: 250px; background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 30px;">
      <svg width="112" height="112" viewBox="0 0 100 100" style="display: block; flex: none;">
        <circle cx="50" cy="50" r="50" fill="#ffffff"/>
        <text x="50" y="46.5" text-anchor="middle" dominant-baseline="central" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
              font-size="48" font-weight="700" letter-spacing="-1" fill="#000000">Qp</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="font-weight: 700; font-size: 58px; letter-spacing: -1.4px; color: #ffffff; line-height: 0.92;">Qp Market</div>
        <div style="font-weight: 500; font-size: 15px; letter-spacing: 6.0px; color: #9a9a9a;">PRELOVED · RESOLD</div>
      </div>
    </div>
    <div style="font-weight: 600; font-size: 12px; letter-spacing: 1.4px; color: #7a7a7a;">WITH A WORDMARK — MONOGRAM ONLY</div>
  </div>

</div>
</x-dc>
</body>
</html>
